<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: system-ui, sans-serif; background: #eff3f9; color: #1f2d41; }
      .boot { padding: 40px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><div class="boot">Loading…</div></div>
    <script>
      function showBootError(msg) {
        var el = document.getElementById('root');
        if (!el || el.querySelector('form, .login, .shell')) return;
        el.innerHTML =
          '<div class="boot"><h1>Failed to load</h1><pre style="white-space:pre-wrap;color:#e81500">' +
          String(msg) +
          '</pre></div>';
      }
      window.addEventListener('error', function (e) {
        showBootError((e.error && e.error.stack) || e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        showBootError(e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
